services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce-demo
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  realtime-api:
    build: .
    command: uvicorn src.realtime.api:app --host 0.0.0.0 --port 8000
    environment:
      RABBITMQ_URL: amqp://ecommerce:ecommerce-demo@rabbitmq:5672/%2F
      RABBITMQ_QUEUE: ecommerce.order.events
      REALTIME_DB_PATH: /app/artifacts/realtime.duckdb
      REALTIME_EMBED_CONSUMER: "true"
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - analytics-artifacts:/app/artifacts
    restart: unless-stopped

  dashboard:
    build: .
    command: >-
      sh -c "test -f artifacts/ecommerce.duckdb ||
      python -m src.cli all --rows 100000 --runs 3;
      streamlit run src/dashboard.py"
    environment:
      REALTIME_API_URL: http://realtime-api:8000
    ports:
      - "8501:8501"
    depends_on:
      - realtime-api
    volumes:
      - analytics-artifacts:/app/artifacts
    restart: unless-stopped

  simulator:
    build: .
    command: >-
      python -m src.realtime.simulator
      --api-url http://realtime-api:8000
      --events 0
      --interval 1
    depends_on:
      - realtime-api
    profiles: ["demo"]
    restart: unless-stopped

volumes:
  analytics-artifacts:
  rabbitmq-data:
