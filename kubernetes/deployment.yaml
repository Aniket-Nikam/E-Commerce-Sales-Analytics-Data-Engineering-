apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-duckdb
  namespace: ecommerce-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-duckdb
  template:
    metadata:
      labels:
        app: ecommerce-duckdb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: warehouse-init
          image: ecommerce-duckdb:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - test -f /app/artifacts/ecommerce.duckdb || python -m src.cli all --rows 100000 --runs 3
          volumeMounts:
            - name: analytics-data
              mountPath: /app/artifacts
      containers:
        - name: dashboard
          image: ecommerce-duckdb:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: REALTIME_API_URL
              value: http://realtime-api:8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: analytics-data
              mountPath: /app/artifacts
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: ecommerce-duckdb-data
