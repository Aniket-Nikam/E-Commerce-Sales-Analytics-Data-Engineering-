apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-api
  namespace: ecommerce-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-api
  template:
    metadata:
      labels:
        app: realtime-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api-consumer
          image: ecommerce-duckdb:1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["src.realtime.api:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
            - name: RABBITMQ_QUEUE
              value: ecommerce.order.events
            - name: REALTIME_DB_PATH
              value: /app/artifacts/realtime.duckdb
            - name: REALTIME_EMBED_CONSUMER
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: analytics-data
              mountPath: /app/artifacts
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: ecommerce-duckdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-api
  namespace: ecommerce-analytics
spec:
  selector:
    app: realtime-api
  ports:
    - name: http
      port: 8000
      targetPort: http
